<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barok i Oświecenie – test maturalny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3f5f7; --sheet:#ffffff; --ink:#15202b; --muted:#5c6b7a; --line:#d5dce3;
  --pen:#d1242f; --mark:#fff0a8;
  --ok:#1f7a4d; --ok-bg:#e2f3ea; --mid:#8f5b00; --mid-bg:#fdf0d5; --bad:#b4232c; --bad-bg:#fbe4e5;
  --plum:#8a3b6e; --blue:#1f5f99; --slate:#4d5d6d;
  --btn:#15202b; --btn-ink:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10161c; --sheet:#18212a; --ink:#e8edf2; --muted:#97a5b3; --line:#2c3945;
    --pen:#ff6b73; --mark:#5a4d0c;
    --ok:#5fd39b; --ok-bg:#17362a; --mid:#f0b95a; --mid-bg:#3a2b0d; --bad:#ff7b82; --bad-bg:#40191c;
    --plum:#d79bc0; --blue:#86b6e6; --slate:#a9b6c3;
    --btn:#e8edf2; --btn-ink:#10161c;
  }
}
:root[data-theme="dark"]{
  --paper:#10161c; --sheet:#18212a; --ink:#e8edf2; --muted:#97a5b3; --line:#2c3945;
  --pen:#ff6b73; --mark:#5a4d0c;
  --ok:#5fd39b; --ok-bg:#17362a; --mid:#f0b95a; --mid-bg:#3a2b0d; --bad:#ff7b82; --bad-bg:#40191c;
  --plum:#d79bc0; --blue:#86b6e6; --slate:#a9b6c3;
  --btn:#e8edf2; --btn-ink:#10161c;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);scroll-behavior:smooth;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font:16px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 72px}
h1,h2,h3{margin:0}
.serif{font-family:"Source Serif 4",Georgia,"Times New Roman",serif}
.hand{font-family:Caveat,"Bradley Hand","Segoe Script","Comic Sans MS",cursive;font-weight:700}

/* ---------- buttons ---------- */
.btn{appearance:none;border:1.5px solid var(--btn);background:var(--btn);color:var(--btn-ink);
  padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.pen{background:var(--pen);border-color:var(--pen);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- intro ---------- */
.intro{padding-top:56px}
.intro h1{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:clamp(2rem,6vw,3.1rem);line-height:1.1;letter-spacing:-.01em;max-width:16ch}
.intro .lead{font-family:"Source Serif 4",Georgia,serif;font-size:1.15rem;color:var(--muted);max-width:52ch;margin:16px 0 28px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--sheet);margin-bottom:28px}
.fact{padding:14px 16px;border-right:1px solid var(--line)}
.fact:last-child{border-right:0}
.fact b{display:block;font-size:1.6rem;font-family:"Source Serif 4",Georgia,serif;line-height:1.2}
.fact span{color:var(--muted);font-size:.9rem}
.howto{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:28px}
.howto h2{font-size:1.05rem;margin-bottom:8px}
.howto p{margin:0 0 8px;color:var(--muted)}
.howto p:last-child{margin:0}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar .in{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.topbar .t{font-weight:600}
.topbar .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.92rem}
.progress{height:4px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--ink);transition:width .25s}

/* ---------- question sheet ---------- */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:22px 22px 24px;margin-top:20px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;font-size:.85rem}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;border:1.5px solid currentColor;font-weight:600;font-size:.82rem;line-height:1.6}
.e-barok{color:var(--plum)} .e-osw{color:var(--blue)} .e-obie{color:var(--slate)}
.kind{color:var(--muted)}
.pts{margin-left:auto;color:var(--muted)}
.qtext{font-family:"Source Serif 4",Georgia,serif;font-weight:400;font-size:1.22rem;line-height:1.5;margin-bottom:18px}
.qtext .qn{font-weight:600;margin-right:6px}
.len{color:var(--muted);font-size:.86rem;margin:-8px 0 12px}
textarea{width:100%;min-height:96px;resize:vertical;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);line-height:1.55}
textarea:focus{border-color:var(--ink);outline:none;background:var(--sheet)}
.wc{color:var(--muted);font-size:.84rem;text-align:right;margin-top:4px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer;background:var(--paper)}
.opt:hover{border-color:var(--ink)}
.opt input{margin-top:5px;accent-color:var(--ink);width:18px;height:18px}
.opt:has(input:checked){border-color:var(--ink);background:var(--sheet);box-shadow:inset 3px 0 0 var(--ink)}
.tfrow{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.tfrow:last-child{border-bottom:0}
.tfrow p{margin:0;flex:1}
.tfbtns{display:flex;gap:6px}
.tfbtns button{min-width:76px;padding:8px 10px;border:1.5px solid var(--line);background:var(--paper);border-radius:8px;cursor:pointer;font-weight:600;min-height:40px}
.tfbtns button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.fillp{font-family:"Source Serif 4",Georgia,serif;font-size:1.12rem;line-height:2.6}
.fillp input{border:0;border-bottom:2px solid var(--ink);background:var(--paper);padding:2px 8px;min-width:150px;width:16ch;max-width:100%;border-radius:4px 4px 0 0;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:1rem}
.fillp input:focus{outline:none;background:var(--mark)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.qnav{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}
.qnav button{width:38px;height:38px;border-radius:8px;border:1.5px solid var(--line);background:var(--sheet);cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums}
.qnav button.done{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.qnav button.cur{outline:3px solid var(--blue);outline-offset:1px}
.legend{color:var(--muted);font-size:.85rem;margin-top:8px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(10,16,22,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal[hidden]{display:none}
.modal .box{background:var(--sheet);border-radius:12px;max-width:440px;width:100%;padding:24px;border:1px solid var(--line)}
.modal h2{font-family:"Source Serif 4",Georgia,serif;font-size:1.3rem;margin-bottom:8px}
.modal p{color:var(--muted);margin:0 0 18px}

/* ---------- results ---------- */
.rhead{padding-top:36px}
.score-card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:26px 24px;display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.circled{position:relative;display:inline-block;padding:10px 26px;color:var(--pen)}
.circled .n{font-size:clamp(3.4rem,13vw,5.2rem);line-height:1;position:relative;z-index:1;white-space:nowrap}
.circled svg{position:absolute;inset:-6px -8px;width:calc(100% + 16px);height:calc(100% + 12px);z-index:0}
.circled path{fill:none;stroke:var(--pen);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:640;stroke-dashoffset:640;animation:draw 1.1s .15s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.verdict h1{font-family:"Source Serif 4",Georgia,serif;font-size:1.6rem;font-weight:600;line-height:1.25;margin-bottom:6px}
.verdict p{margin:0;color:var(--muted)}
.note{background:var(--mid-bg);color:var(--ink);border-left:4px solid var(--mid);padding:12px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:.94rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media (max-width:680px){.grid2{grid-template-columns:1fr}.sheet{padding:18px 16px 20px}.pts{margin-left:0}}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.panel h2{font-size:1.02rem;margin-bottom:12px}
.stat{margin-bottom:12px}
.stat:last-child{margin-bottom:0}
.stat .lab{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;margin-bottom:4px}
.stat .lab span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;border-radius:99px;background:var(--ink)}
.bar.c-barok span{background:var(--plum)} .bar.c-osw span{background:var(--blue)} .bar.c-obie span{background:var(--slate)}
.bar.c-ok span{background:var(--ok)}
.weak{list-style:none;margin:0;padding:0}
.weak li{display:flex;gap:10px;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.weak li:last-child{border-bottom:0}
.weak a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer}
.weak a:hover{text-decoration-color:var(--ink)}
.weak small{color:var(--muted);display:block}
.weak .lost{color:var(--pen);white-space:nowrap;font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0 4px}
.filters button{padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--sheet);cursor:pointer;font-weight:500;min-height:40px}
.filters button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.rcard{background:var(--sheet);border:1px solid var(--line);border-left-width:6px;border-radius:12px;padding:20px 22px;margin-top:16px}
.rcard[data-st="full"]{border-left-color:var(--ok)}
.rcard[data-st="part"]{border-left-color:var(--mid)}
.rcard[data-st="zero"]{border-left-color:var(--bad)}
.rcard[data-st="empty"]{border-left-color:var(--muted)}
.rcard.flash{animation:flash 1.2s}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--mark)}100%{box-shadow:0 0 0 0 transparent}}
.rc-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.rc-top .meta{margin-bottom:8px}
.grade{font-size:2.3rem;line-height:1;color:var(--pen);white-space:nowrap;transform:rotate(-4deg);margin-top:-4px}
.rcard[data-st="full"] .grade{color:var(--ok)}
.rc-q{font-family:"Source Serif 4",Georgia,serif;font-size:1.08rem;margin:2px 0 14px}
.block{border-radius:8px;padding:12px 14px;margin:10px 0}
.block h3{font-size:.86rem;font-weight:600;color:var(--muted);margin-bottom:6px}
.yours{background:var(--paper);white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.yours.empty{color:var(--muted);font-style:italic}
.crits{margin:8px 0 0;padding:0;list-style:none}
.crit{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-radius:8px;cursor:pointer}
.crit:hover{background:var(--paper)}
.crit input{margin-top:4px;width:18px;height:18px;accent-color:var(--ok);flex:none}
.crit .ct{flex:1}
.crit.on .ct{background:linear-gradient(transparent 58%,var(--mark) 58%)}
.crit .tag{font-size:.78rem;color:var(--muted);white-space:nowrap;font-style:normal;padding-top:2px}
.model{border:1.5px dashed var(--line);border-radius:8px;padding:0;margin-top:12px;background:transparent}
.model summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none}
.model summary::-webkit-details-marker{display:none}
.model summary::before{content:"▸ ";color:var(--muted)}
.model[open] summary::before{content:"▾ "}
.model .mb{padding:0 14px 14px;font-family:"Source Serif 4",Georgia,serif}
.orow{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:8px;margin-bottom:6px;border:1.5px solid var(--line)}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.bad{border-color:var(--bad);background:var(--bad-bg)}
.orow b{flex:none;width:1.2em}
.fillres{font-family:"Source Serif 4",Georgia,serif;line-height:2.3}
.pill{display:inline-block;padding:0 10px;border-radius:6px;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:.95rem;border:1.5px solid}
.pill.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok)}
.pill.bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad)}
.foot{margin-top:36px;display:flex;gap:10px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.9rem;margin:6px 0 0}
.empty-list{color:var(--muted);padding:24px 0;text-align:center}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .circled path{animation:none;stroke-dashoffset:0}
  .rcard.flash{animation:none}
  .progress i{transition:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="box">
    <h2 id="mtitle">Zakończyć test?</h2>
    <p id="mtext"></p>
    <div class="row">
      <button class="btn" id="m-yes">Zakończ i sprawdź</button>
      <button class="btn ghost" id="m-no">Wróć do zadań</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* =====================================================================
   BANK PYTAŃ
   format: choice | tf | fill | text
   criteria[].k – wyrażenia regularne (na tekście bez polskich znaków, małe litery);
   kryterium jest „wykryte”, gdy pasują wszystkie.
   ===================================================================== */
const Q = [
/* ------------------------------ BAROK ------------------------------ */
{id:'b1',epoch:'Barok',topic:'Etymologia nazwy epoki',ref:'Barok – wstęp',kind:'Krótka odpowiedź',format:'text',rows:3,len:'1–2 zdania',
 prompt:'Podaj, z jakiego języka pochodzi nazwa epoki „barok”, i wyjaśnij, co pierwotnie oznaczało to słowo.',
 criteria:[
  {t:'Nazwa pochodzi z języka portugalskiego (barocco).',k:[/portug|barocc/]},
  {t:'Pierwotnie oznaczała perłę o nieregularnym kształcie.',k:[/perl/,/nieregul|nieforem|krzyw|dziwacz|niesymetr/]}],
 model:'Nazwa pochodzi od portugalskiego słowa <i>barocco</i> – „perła o nieregularnym kształcie”. Pasuje do epoki kontrastów, niepokoju i udziwnień.'},

{id:'b2',epoch:'Barok',topic:'Filozofia baroku – Pascal',ref:'Barok – filozofia',kind:'Wybór jednokrotny',format:'choice',
 prompt:'Kto jest autorem tzw. zakładu, według którego opłaca się wierzyć w Boga, bo stawką jest życie wieczne, a tracimy jedynie doczesne przyjemności?',
 options:['René Descartes (Kartezjusz)','Blaise Pascal','Wolter','John Locke'],correct:1,
 model:'<b>Blaise Pascal.</b> To także twórca określenia człowieka jako „trzciny myślącej” – kruchej biologicznie, lecz potężnej dzięki rozumowi. Descartes był twórcą racjonalizmu („Cogito ergo sum”).'},

{id:'b3',epoch:'Barok',topic:'Konceptyzm i marinizm',ref:'Barok – cechy literatury',kind:'Wyjaśnienie pojęć',format:'text',rows:5,len:'3–4 zdania',
 prompt:'Zdefiniuj pojęcia konceptyzm i marinizm.',
 criteria:[
  {t:'Konceptyzm: dążenie do zaskoczenia odbiorcy niezwykłym pomysłem (konceptem).',k:[/zaskocz|zaszok|niezwykl|nieoczekiw|pomysl|oryginaln/]},
  {t:'Marinizm: nazwa pochodzi od Giambattisty Marina / poezji włoskiej.',k:[/giamb|marina|wloch|wloski/]},
  {t:'Marinizm: wirtuozeria formy, bogactwo środków stylistycznych, gra słów, zaskakujące puenty.',k:[/wirtuoz|gra slow|gry slow|gre slow|bogactw|srodk|puent|zabaw|forma|formal/]}],
 model:'<b>Konceptyzm</b> – dążenie do zaskoczenia, a nawet zaszokowania odbiorcy niezwykłym pomysłem (konceptem). <b>Marinizm</b> – kierunek w poezji wywodzący się od włoskiego poety Giambattisty Marina; ceni wirtuozerię formalną, bogactwo środków stylistycznych, grę słów i zaskakujące puenty (często w wierszach o miłości).'},

{id:'b4',epoch:'Barok',topic:'Morsztyn – „Do trupa”',ref:'Barok – Jan Andrzej Morsztyn',kind:'Analiza utworu',format:'text',rows:6,len:'3–5 zdań',
 prompt:'Omów budowę sonetu „Do trupa” Jana Andrzeja Morsztyna: na czym polega koncept utworu i jaką puentę zawiera?',
 criteria:[
  {t:'Koncept: zestawienie i porównanie człowieka nieszczęśliwie zakochanego z trupem.',k:[/zakochan|kochan|nieszczesli|podmiot/,/trup|zmarl|umarl|zwlok/]},
  {t:'Puenta: zakochany cierpi bardziej niż trup.',k:[/bardziej|wiecej|gorzej|silniej|wieksze/,/cierp|meki|mecz|bol/]},
  {t:'Uzasadnienie: trup nic nie czuje, a zakochany płonie z miłości.',k:[/nie czuje|nie odczuw|niczego nie|nic nie|plon|plom|ogien|zar\b|pala|gore/]}],
 model:'Koncept polega na zestawieniu i porównaniu człowieka nieszczęśliwie zakochanego z trupem. Puenta jest zaskakująca: zakochany cierpi bardziej niż trup, bo trup niczego nie czuje, a zakochany płonie z miłości. Utwór to przykład poezji dworskiej i marinizmu, w której miłość bywa grą intelektualną.'},

{id:'b5',epoch:'Barok',topic:'Sęp Szarzyński – Sonet V',ref:'Barok – Mikołaj Sęp Szarzyński',kind:'Analiza utworu',format:'text',rows:5,len:'3–4 zdania',
 prompt:'Wyjaśnij, dlaczego według Mikołaja Sępa Szarzyńskiego (Sonet V, „O nietrwałej miłości rzeczy świata tego”) miłość do rzeczy tego świata jest złudna. Co poeta uznaje za jedyny godny przedmiot miłości?',
 criteria:[
  {t:'Rzeczy doczesne są nietrwałe, przemijają.',k:[/przemij|nietrwal|nie trwa|mijaj|przemin|kruch|znikom|ulotn/]},
  {t:'Podano przykłady dóbr doczesnych (bogactwo, władza, uroda).',k:[/bogactw|wladz|urod|piekn|majatek|slaw/]},
  {t:'Jedynym godnym obiektem miłości jest wieczny Bóg.',k:[/bog/,/wiecz|trwal|niezmien|jedyn|godn/]}],
 model:'Miłość do dóbr doczesnych (bogactwa, władzy, urody) jest złudna, bo te rzeczy przemijają. Jedynym godnym obiektem miłości jest wieczny Bóg.'},

{id:'b6',epoch:'Barok',topic:'Uzupełnianie: fakty z baroku',ref:'Barok – filozofia, vanitas, Pasek, Potocki',kind:'Uzupełnianie luk',format:'fill',
 text:'Twórcą racjonalizmu, autorem sentencji „Cogito ergo sum”, był {1}. Motyw vanitas pochodzi z Księgi {2}. Jan Chryzostom Pasek służył w wojsku hetmana Stefana {3}. Autorem utworów „Zbytki polskie” i „Nierządem Polska stoi”, krytykującym sarmatyzm, był {4}.',
 prompt:'Uzupełnij luki w zdaniach.',
 criteria:[
  {t:'Luka 1: Kartezjusz (René Descartes)',k:[/kartezj|descartes|decartes/]},
  {t:'Luka 2: Koheleta',k:[/kohelet/]},

 model:'<b>Przykładowy plan.</b> Teza: literatura może wpływać na losy państwa, kształtując postawy i ostrzegając przed zagrożeniami, choć sama nie zastąpi działań politycznych. Argument barokowy: Potocki w „Zbytkach polskich” i „Nierządem Polska stoi” piętnuje rozrzutność, bezprawie i chaos, ostrzegając przed upadkiem Rzeczypospolitej. Argument oświeceniowy: Krasicki (satyry, bajki) uczy krytycznego myślenia; Niemcewicz w „Powrocie posła” wspiera reformy Sejmu Wielkiego; Staszic i Kołłątaj tworzą publicystykę reformatorską; „Monitor” i Teatr Narodowy realizują funkcję dydaktyczną. Kontrargument: mimo tych wysiłków nastąpiły rozbiory (1772, 1793, 1795) – literatura podtrzymała jednak ducha narodu. Wniosek: literatura nie zmienia biegu historii sama, ale może przygotować społeczeństwo do zmian.'}
];

const QM = Object.fromEntries(Q.map(q=>[q.id,q]));
const KEY = 'matura-barok-oswiecenie-v1';
const EPOCH_CLS = {'Barok':'e-barok','Oświecenie':'e-osw','Obie epoki':'e-obie'};
const BAR_CLS   = {'Barok':'c-barok','Oświecenie':'c-osw','Obie epoki':'c-obie'};

/* ------------------------------ stan ------------------------------ */
let S = {screen:'intro',ids:[],idx:0,answers:{},marks:{},auto:{},filter:'all',base:0,t0:0,end:0};
let timer = null;
const app = document.getElementById('app');

const store = {
  get(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}},
  set(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}},
  del(){try{localStorage.removeItem(KEY)}catch(e){}}
};
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').toLowerCase().replace(/ł/g,'l').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const isClosed = q => q.format==='choice' || q.format==='tf';
const pts = q => q.format==='choice' ? 1 : q.format==='tf' ? q.items.length : q.criteria.length;
const curQ = () => QM[S.ids[S.idx]];
const ans = q => S.answers[q.id] || (S.answers[q.id] = []);
const fmtTime = ms => { const s=Math.max(0,Math.round(ms/1000)); const m=Math.floor(s/60); return m+':'+String(s%60).padStart(2,'0'); };
const elapsed = () => S.base + ((S.end||Date.now()) - S.t0);
const wordCount = t => (String(t||'').trim().match(/\S+/g)||[]).length;

function hasAnswer(q){
  const a = S.answers[q.id]||[];
  if(q.format==='choice') return typeof a[0]==='number';
  if(q.format==='tf') return a.some(v=>v===true||v===false);
  return a.some(v=>String(v||'').trim()!=='');
}
function save(){
  store.set({ids:S.ids,idx:S.idx,answers:S.answers,elapsed:elapsed()});
}

/* ---------------------------- ocenianie ---------------------------- */
function detect(q){
  const a = S.answers[q.id]||[];
  if(q.format==='fill'){
    return q.criteria.map((c,i)=>{ const v=norm(a[i]); return v.trim()!=='' && c.k.every(r=>r.test(v)); });
  }
  const raw = a[0]||''; const v = norm(raw); const wc = wordCount(raw);
  return q.criteria.map(c=>{
    if(!v.trim()) return false;
    if(c.words && wc < c.words) return false;
    return (c.k||[]).every(r=>r.test(v));
  });
}
function gradeAll(){
  S.ids.forEach(id=>{
    const q = QM[id];
    if(isClosed(q)) return;
    const d = detect(q);
    S.auto[id] = d;
    S.marks[id] = d.slice();
  });
}
function earned(q){
  const a = S.answers[q.id]||[];
  if(q.format==='choice') return a[0]===q.correct ? 1 : 0;
  if(q.format==='tf') return q.items.reduce((s,it,i)=>s+(a[i]===it.a?1:0),0);
  return (S.marks[q.id]||[]).filter(Boolean).length;
}
function status(q){
  const e = earned(q), p = pts(q);
  if(e===p) return 'full';
  if(e>0) return 'part';
  return hasAnswer(q) ? 'zero' : 'empty';
}

/* ------------------------------ intro ------------------------------ */
function renderIntro(){
  clearInterval(timer);
  const total = Q.reduce((s,q)=>s+pts(q),0);
  const closedPts = Q.filter(isClosed).reduce((s,q)=>s+pts(q),0);
  const closedN = Q.filter(isClosed).length;
  const d = store.get();
  const resume = d && d.ids && d.ids.length && d.answers && Object.keys(d.answers).length;
  app.innerHTML = `
  <main class="wrap intro">
    <h1>Barok i Oświecenie w Polsce</h1>
    <p class="lead">Test w formule maturalnej: dominują zadania otwarte – definicje, analiza utworów, porównanie i rozprawka. Po zakończeniu zobaczysz każdy błąd i swoją skuteczność.</p>
    <div class="facts" role="list">
      <div class="fact" role="listitem"><b>${Q.length}</b><span>zadań</span></div>
      <div class="fact" role="listitem"><b>${total}</b><span>punktów do zdobycia</span></div>
      <div class="fact" role="listitem"><b>${Q.length-closedN}</b><span>zadań otwartych i luk</span></div>
      <div class="fact" role="listitem"><b>${closedN}</b><span>zadania zamknięte (${closedPts} pkt)</span></div>
    </div>
    <section class="howto">
      <h2>Jak jest oceniana Twoja praca</h2>
      <p>Zadania zamknięte sprawdza się automatycznie. W zadaniach otwartych każdy punkt odpowiada jednemu kryterium (jak w kluczu maturalnym).</p>
      <p>Program podpowiada, które kryteria spełniłeś, na podstawie słów kluczowych w Twojej odpowiedzi. To tylko sugestia – po teście zobaczysz wzorcową odpowiedź i możesz sam poprawić każdy punkt.</p>
      <p>Czasu nie ograniczamy (orientacyjnie 60–80 minut). Odpowiedzi zapisują się w przeglądarce, jeśli ta na to pozwala.</p>
    </section>
    <div class="row">
      <button class="btn" data-act="start">Rozpocznij test</button>
      ${resume?`<button class="btn ghost" data-act="resume">Wznów zapisany test</button>`:''}
    </div>
  </main>`;
}

/* ------------------------------- test ------------------------------- */
function startTest(ids){
  S = {screen:'test',ids:ids||Q.map(q=>q.id),idx:0,answers:{},marks:{},auto:{},filter:'all',base:0,t0:Date.now(),end:0};
  save(); renderTest(); window.scrollTo(0,0);
}
function resumeTest(){
  const d = store.get(); if(!d) return startTest();
  S = {screen:'test',ids:d.ids,idx:Math.min(d.idx||0,d.ids.length-1),answers:d.answers||{},marks:{},auto:{},filter:'all',base:d.elapsed||0,t0:Date.now(),end:0};
  renderTest();
}
function inputHTML(q){
  const a = ans(q);
  if(q.format==='choice'){
    return q.options.map((o,i)=>`<label class="opt"><input type="radio" name="c" data-choice="${i}" ${a[0]===i?'checked':''}><span>${esc(o)}</span></label>`).join('');
  }
  if(q.format==='tf'){
    return q.items.map((it,i)=>`<div class="tfrow"><p>${esc(it.t)}</p><div class="tfbtns" role="group" aria-label="Zdanie ${i+1}">
      <button type="button" data-tf="${i}" data-v="1" aria-pressed="${a[i]===true}">Prawda</button>
      <button type="button" data-tf="${i}" data-v="0" aria-pressed="${a[i]===false}">Fałsz</button></div></div>`).join('');
  }
  if(q.format==='fill'){
    const html = esc(q.text).replace(/\{(\d)\}/g,(m,n)=>{
      const i = +n-1;
      return `<input type="text" data-i="${i}" value="${esc(a[i]||'')}" aria-label="Luka ${n}" autocomplete="off" spellcheck="false">`;
    });
    return `<p class="fillp">${html}</p>`;
  }
  return `${q.len?`<p class="len">Oczekiwana długość: ${esc(q.len)}</p>`:''}
    <textarea data-i="0" rows="${q.rows||5}" placeholder="Wpisz odpowiedź własnymi słowami…" aria-label="Twoja odpowiedź">${esc(a[0]||'')}</textarea>
    <div class="wc" id="wc">${wordCount(a[0])} słów</div>`;
}
function renderTest(){
  S.screen='test';
  clearInterval(timer);
  const q = curQ(), n = S.ids.length;
  const last = S.idx===n-1;
  app.innerHTML = `
  <header class="topbar">
    <div class="in">
      <span class="t">Zadanie ${S.idx+1} z ${n}</span>
      <span class="row"><span class="timer" id="timer">${fmtTime(elapsed())}</span>
      <button class="btn ghost" data-act="finish" style="min-height:38px;padding:6px 14px">Zakończ test</button></span>
    </div>
    <div class="progress"><i id="pbar" style="width:${answeredCount()/n*100}%"></i></div>
  </header>
  <main class="wrap">
    <article class="sheet" aria-labelledby="qt">
      <div class="meta">
        <span class="chip ${EPOCH_CLS[q.epoch]}">${esc(q.epoch)}</span>
        <span class="kind">${esc(q.kind)}</span>
        <span class="pts">${pts(q)} pkt</span>
      </div>
      <h2 class="qtext" id="qt"><span class="qn">${S.idx+1}.</span>${esc(q.prompt)}</h2>
      <div class="ans">${inputHTML(q)}</div>
    </article>
    <div class="pager">
      <button class="btn ghost" data-act="prev" ${S.idx===0?'disabled':''}>Wstecz</button>
      ${last?`<button class="btn pen" data-act="finish">Zakończ i sprawdź</button>`:`<button class="btn" data-act="next">Dalej</button>`}
    </div>
    <nav class="qnav" aria-label="Lista zadań" id="qnav">${navHTML()}</nav>
    <p class="legend">Ciemne pola to zadania z odpowiedzią. Możesz wracać do dowolnego zadania.</p>
  </main>`;
  timer = setInterval(()=>{const t=document.getElementById('timer'); if(t) t.textContent=fmtTime(elapsed());},1000);
}
function answeredCount(){ return S.ids.filter(id=>hasAnswer(QM[id])).length; }
function navHTML(){
  return S.ids.map((id,i)=>`<button type="button" data-go="${i}" class="${hasAnswer(QM[id])?'done':''} ${i===S.idx?'cur':''}" aria-label="Zadanie ${i+1}${hasAnswer(QM[id])?' (odpowiedziano)':''}">${i+1}</button>`).join('');
}
function refreshNav(){
  const nav = document.getElementById('qnav'); if(nav) nav.innerHTML = navHTML();
  const b = document.getElementById('pbar'); if(b) b.style.width = (answeredCount()/S.ids.length*100)+'%';
}
function go(i){ S.idx = Math.max(0,Math.min(S.ids.length-1,i)); save(); renderTest(); window.scrollTo(0,0); }

function askFinish(){
  const left = S.ids.length - answeredCount();
  document.getElementById('mtext').textContent = left>0
    ? `Bez odpowiedzi zostało ${left} z ${S.ids.length} zadań – dostaną 0 punktów. Po zakończeniu nie da się już zmienić odpowiedzi.`
    : 'Odpowiedziałeś na wszystkie zadania. Po zakończeniu nie da się już zmienić odpowiedzi.';
  document.getElementById('modal').hidden = false;
  document.getElementById('m-yes').focus();
}
function finish(){
  document.getElementById('modal').hidden = true;
  S.end = Date.now();
  clearInterval(timer);
  S.screen='results'; S.filter='all';
  gradeAll();
  store.del();
  renderResults();
  window.scrollTo(0,0);
}

/* ----------------------------- wyniki ----------------------------- */
function totals(list){
  return list.reduce((o,q)=>{o.p+=pts(q);o.e+=earned(q);return o;},{p:0,e:0});
}
function pct(o){ return o.p ? Math.round(o.e/o.p*100) : 0; }
function verdict(p){
  if(p>=85) return ['Znakomicie – materiał opanowany.','Nawet w zadaniach otwartych trafiasz w większość kryteriów.'];
  if(p>=70) return ['Bardzo dobry wynik.','Kilka luk do uzupełnienia – zobacz zadania oznaczone poniżej.'];
  if(p>=50) return ['Solidna podstawa, ale są luki.','Wróć do zadań z utraconymi punktami i porównaj je ze wzorcem.'];
  if(p>=30) return ['Powyżej progu 30% wymaganego na maturze.','Do bezpiecznego wyniku brakuje powtórki – zacznij od listy poniżej.'];
  return ['Materiał wymaga powtórki.','Zacznij od zadań z największą stratą punktów i sprawdź wzorcowe odpowiedzi.'];
}
function bars(groups){
  return groups.map(g=>`<div class="stat"><div class="lab"><span>${esc(g.label)}</span><span>${g.e} / ${g.p} pkt · ${g.p?Math.round(g.e/g.p*100):0}%</span></div>
    <div class="bar ${g.cls||''}"><span style="width:${g.p?g.e/g.p*100:0}%"></span></div></div>`).join('');
}
function summaryHTML(){
  const qs = S.ids.map(id=>QM[id]);
  const all = totals(qs), p = pct(all);
  const [vh,vp] = verdict(p);
  const epochs = ['Barok','Oświecenie','Obie epoki'].map(ep=>{const l=qs.filter(q=>q.epoch===ep); if(!l.length) return null; const t=totals(l); return {label:ep,e:t.e,p:t.p,cls:BAR_CLS[ep]};}).filter(Boolean);
  const cl = qs.filter(isClosed), op = qs.filter(q=>!isClosed(q));
  const types = [];
  if(op.length){const t=totals(op); types.push({label:'Zadania otwarte i luki',e:t.e,p:t.p});}
  if(cl.length){const t=totals(cl); types.push({label:'Zadania zamknięte',e:t.e,p:t.p,cls:'c-ok'});}
  const weak = qs.map(q=>({q,lost:pts(q)-earned(q)})).filter(x=>x.lost>0).sort((a,b)=>b.lost-a.lost).slice(0,6);
  const openMissed = qs.filter(q=>!isClosed(q)&&hasAnswer(q)&&earned(q)<pts(q)).length;
  return `
  <section class="score-card" aria-label="Wynik">
    <div class="circled hand"><span class="n">${all.e}/${all.p}</span>
      <svg viewBox="0 0 210 90" preserveAspectRatio="none" aria-hidden="true"><path d="M14 46 C 10 16, 90 4, 150 9 C 200 14, 208 52, 160 72 C 110 90, 22 82, 8 52 C 5 40, 20 28, 44 20"/></svg>
    </div>
    <div class="verdict">
      <h1>${p}% · ${esc(vh)}</h1>
      <p>${esc(vp)}</p>
      <p class="hint">Czas pracy: ${fmtTime(elapsed())} · ${qs.filter(hasAnswer).length} z ${qs.length} zadań z odpowiedzią</p>
    </div>
  </section>
  <div class="note">Punkty za zadania otwarte to <b>sugestia programu</b> oparta na słowach kluczowych. Przy każdym zadaniu porównaj swoją odpowiedź ze wzorcem i zaznacz lub odznacz kryteria – wynik przeliczy się od razu.${openMissed?` Teraz do sprawdzenia: ${openMissed} zadań z niepełną punktacją.`:''}</div>
  <div class="grid2">
    <section class="panel"><h2>Skuteczność według epok</h2>${bars(epochs)}</section>
    <section class="panel"><h2>Skuteczność według typu zadań</h2>${bars(types)}</section>
  </div>
  <section class="panel" style="margin-top:16px">
    <h2>Do powtórki – najwięcej utraconych punktów</h2>
    ${weak.length?`<ul class="weak">${weak.map(w=>`<li><span><a data-jump="${w.q.id}">${esc(w.q.topic)}</a><small>${esc(w.q.ref)}</small></span><span class="lost">−${w.lost} pkt</span></li>`).join('')}</ul>`
      :`<p class="empty-list">Brak utraconych punktów. Świetna robota!</p>`}
  </section>`;
}
function renderResults(){
  const qs = S.ids.map(id=>QM[id]);
  const wrongCount = qs.filter(q=>earned(q)<pts(q)).length;
  app.innerHTML = `
  <main class="wrap rhead">
    <div id="summary">${summaryHTML()}</div>
    <div class="filters" role="group" aria-label="Filtr zadań">
      ${[['all','Wszystkie'],['wrong','Do poprawy'],['full','Zaliczone w pełni'],['empty','Bez odpowiedzi']].map(([k,l])=>`<button type="button" data-filter="${k}" aria-pressed="${S.filter===k}">${l}</button>`).join('')}
    </div>
    <div id="cards">${qs.map((q,i)=>cardHTML(q,i)).join('')}</div>
    <div class="foot">
      <button class="btn pen" data-act="retry" ${wrongCount?'':'disabled'}>Powtórz tylko zadania z błędami (${wrongCount})</button>
      <button class="btn ghost" data-act="restart">Zacznij test od nowa</button>
    </div>
  </main>`;
  applyFilter();
}
function cardHTML(q,i){
  const st = status(q), e = earned(q), p = pts(q);
  const a = S.answers[q.id]||[];
  let body = '';
  if(q.format==='choice'){
    body = `<div class="block">${q.options.map((o,k)=>{
      const c = k===q.correct, u = a[0]===k;
      return `<div class="orow ${c?'ok':(u?'bad':'')}"><b>${c?'✓':(u?'✗':'')}</b><span>${esc(o)}${u?' <em>(Twoja odpowiedź)</em>':''}${c&&!u?' <em>(poprawna)</em>':''}</span></div>`;
    }).join('')}${typeof a[0]!=='number'?'<p class="hint">Nie wybrano odpowiedzi.</p>':''}</div>`;
  } else if(q.format==='tf'){
    body = `<div class="block">${q.items.map((it,k)=>{
      const ok = a[k]===it.a; const u = a[k]===true?'Prawda':a[k]===false?'Fałsz':'brak odpowiedzi';
      return `<div class="orow ${ok?'ok':'bad'}"><b>${ok?'✓':'✗'}</b><span>${esc(it.t)}<br><small>Twoja odpowiedź: <b style="width:auto">${u}</b>${ok?'':` · poprawna: <b style="width:auto">${it.a?'Prawda':'Fałsz'}</b>`}</small></span></div>`;
    }).join('')}</div>`;
  } else {
    const marks = S.marks[q.id]||[];
    if(q.format==='fill'){
      const filled = esc(q.text).replace(/\{(\d)\}/g,(m,n)=>{
        const k=+n-1; const v=(a[k]||'').trim();
        return `<span class="pill ${marks[k]?'ok':'bad'}">${v?esc(v):'—'}</span>`;
      });
      body = `<div class="block yours" style="white-space:normal"><h3>Twoje odpowiedzi</h3><p class="fillres" style="margin:0">${filled}</p></div>`;
    } else {
      const txt = (a[0]||'').trim();
      body = `<div class="block yours ${txt?'':'empty'}"><h3>Twoja odpowiedź</h3>${txt?esc(txt):'— brak odpowiedzi —'}</div>`;
    }
    const auto = S.auto[q.id]||[];
    body += `<div class="block" style="padding:0"><h3 style="padding:0 6px;margin:12px 0 2px">Kryteria oceny – zaznacz to, co Twoja odpowiedź zawiera</h3>
      <ul class="crits">${q.criteria.map((c,k)=>`
        <li><label class="crit ${marks[k]?'on':''}"><input type="checkbox" data-q="${q.id}" data-c="${k}" ${marks[k]?'checked':''}>
        <span class="ct">${esc(c.t)}</span><em class="tag">${auto[k]?'wykryto':'nie wykryto'}</em></label></li>`).join('')}</ul></div>`;
  }
  const model = `<details class="model" ${st==='full'?'':'open'}><summary>Wzorcowa odpowiedź</summary><div class="mb">${q.model}</div></details>`;
  return `<article class="rcard" id="card-${q.id}" data-id="${q.id}" data-st="${st}">
    <div class="rc-top">
      <div><div class="meta"><span class="chip ${EPOCH_CLS[q.epoch]}">${esc(q.epoch)}</span><span class="kind">${esc(q.kind)}</span></div></div>
      <div class="grade hand" title="Zdobyte punkty">${e}/${p}</div>
    </div>
    <p class="rc-q"><b>${i+1}.</b> ${esc(q.prompt)}</p>
    ${body}${model}
  </article>`;
}
function updateCard(id, focusC){
  const el = document.getElementById('card-'+id); if(!el) return;
  const q = QM[id]; const open = el.querySelector('details.model'); const wasOpen = open ? open.open : null;
  const idx = S.ids.indexOf(id);
  const tmp = document.createElement('div'); tmp.innerHTML = cardHTML(q,idx);
  const neu = tmp.firstElementChild;
  if(wasOpen!==null){ const d = neu.querySelector('details.model'); if(d) d.open = wasOpen; }
  el.replaceWith(neu);
  if(focusC!=null){ const cb = neu.querySelector(`input[data-c="${focusC}"]`); if(cb) cb.focus(); }
  document.getElementById('summary').innerHTML = summaryHTML();
  const wrong = S.ids.filter(i=>earned(QM[i])<pts(QM[i])).length;
  const rb = document.querySelector('[data-act="retry"]');
  if(rb){ rb.disabled = !wrong; rb.textContent = `Powtórz tylko zadania z błędami (${wrong})`; }
}
function applyFilter(){
  document.querySelectorAll('#cards .rcard').forEach(c=>{
    const st = c.dataset.st; const f = S.filter;
    const show = f==='all' || (f==='wrong' && st!=='full') || (f==='full' && st==='full') || (f==='empty' && st==='empty');
    c.hidden = !show;
  });
  const vis = [...document.querySelectorAll('#cards .rcard')].some(c=>!c.hidden);
  let em = document.getElementById('emptyf');
  if(!vis){
    if(!em){ em = document.createElement('p'); em.id='emptyf'; em.className='empty-list'; em.textContent='Brak zadań w tej kategorii.'; document.getElementById('cards').appendChild(em); }
  } else if(em){ em.remove(); }
}
function retry(){
  const ids = S.ids.filter(id=>earned(QM[id])<pts(QM[id]));
  if(!ids.length) return;
  startTest(ids);
}

/* --------------------------- zdarzenia --------------------------- */
app.addEventListener('click',e=>{
  const t = e.target.closest('[data-act],[data-go],[data-tf],[data-filter],[data-jump]');
  if(!t) return;
  if(t.dataset.act){
    const a = t.dataset.act;
    if(a==='start') startTest();
    else if(a==='resume') resumeTest();
    else if(a==='next') go(S.idx+1);
    else if(a==='prev') go(S.idx-1);
    else if(a==='finish') askFinish();
    else if(a==='retry') retry();
    else if(a==='restart'){ store.del(); renderIntro(); window.scrollTo(0,0); }
  } else if(t.dataset.go!=null){ go(+t.dataset.go); }
  else if(t.dataset.tf!=null){
    const q = curQ(), i = +t.dataset.tf; ans(q)[i] = t.dataset.v==='1';
    t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', String((ans(q)[i]===true)===(b.dataset.v==='1'))));
    refreshNav(); save();
  } else if(t.dataset.filter){
    S.filter = t.dataset.filter;
    document.querySelectorAll('.filters button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.filter===S.filter)));
    applyFilter();
  } else if(t.dataset.jump){
    S.filter='all';
    document.querySelectorAll('.filters button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.filter==='all')));
    applyFilter();
    const c = document.getElementById('card-'+t.dataset.jump);
    if(c){ c.scrollIntoView({block:'start'}); c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash'); }
  }
});
app.addEventListener('input',e=>{
  const t = e.target;
  if(S.screen!=='test' || t.dataset.i==null) return;
  const q = curQ(); ans(q)[+t.dataset.i] = t.value;
  if(t.tagName==='TEXTAREA'){ const w=document.getElementById('wc'); if(w) w.textContent = wordCount(t.value)+' słów'; }
  refreshNav(); save();
});
app.addEventListener('change',e=>{
  const t = e.target;
  if(S.screen==='test' && t.dataset.choice!=null){
    const q = curQ(); ans(q)[0] = +t.dataset.choice; refreshNav(); save();
  } else if(S.screen==='results' && t.dataset.q){
    const id = t.dataset.q, k = +t.dataset.c;
    S.marks[id][k] = t.checked;
    updateCard(id,k);
  }
});
document.getElementById('m-yes').addEventListener('click',finish);
document.getElementById('m-no').addEventListener('click',()=>{document.getElementById('modal').hidden=true;});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.getElementById('modal').hidden=true; });

renderIntro();
})();
</script>
</body>
</html>
